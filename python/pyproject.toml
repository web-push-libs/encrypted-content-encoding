[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "http_ece"
version = "1.2.1"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Thomson", email = "martin.thomson@gmail.com" }]
keywords = ["crypto http"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
description = "Encrypted Content Encoding for HTTP"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.11"
dependencies = ["cryptography>=46.0.1"]

[dependency-groups]
lint = [
    "ruff==0.17.4",
]
test = [
    "pytest>=9",
    "pytest-cov",
    "tox>=4.22",
    "tox-gh",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]

[project.urls]
Repository = "https://github.com/web-push-libs/encrypted-content-encoding"

[tool.distutils.bdist_wheel]
universal = 1

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
addopts = "--verbose --cov=http_ece"
log_format = "%(asctime)s,%(msecs)03d %(name)s: %(levelname)s: %(message)s"
log_file_date_format = "%H:%M:%S"

[tool.ruff]
lint.select = ["A", "F", "FURB", "I", "PERF", "PT", "PTH", "RUF", "S", "UP"]
[tool.ruff.lint.extend-per-file-ignores]
"**/tests/**" = ["A001", "A002", "S101"]

[tool.setuptools]
packages = ["http_ece"]

[tool.tox]
env_list = [
    "py311",
    "py312",
    "py313",
    "py314",
    "py315",
]

[tool.tox.env_run_base]
description = "run tests with pytest under {base_python}"
dependency_groups = ["test"]
commands = [
    ["pytest", "{posargs}"],
]

[tool.tox.gh.python]
"3.11" = ["py311"]
"3.12" = ["py312"]
"3.13" = ["py313"]
"3.14" = ["py314"]
"3.15" = ["py315"]
